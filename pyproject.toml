[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "silkweb"
version = "0.0.0"
description = "LLM-native Python web scraping library."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Silkweb Contributors" }]
keywords = ["scraping", "web", "crawler", "playwright", "llm", "pydantic"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

# Minimal install: no browser, no LLM providers.
dependencies = [
  "anyio>=4.0.0",
  "python-dotenv>=1.0.0",
  "diskcache>=5.6.3",
  "hishel>=0.1.1",
  "httpx[http2]>=0.27.0",
  "lxml>=5.0.0",
  "outlines>=0.0.46; python_version < '3.14'",
  "parsel>=1.9.1",
  "pydantic>=2.0.0",
  "structlog>=24.0.0",
  "trafilatura>=1.8.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "rank-bm25>=0.2.2",
  "xxhash>=3.4.1",
  "lark>=1.1.9",
  "anysqlite>=0.0.5",
  "genson>=1.3.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# Tier 2 browser rendering (Playwright)
browser = [
  "playwright>=1.45.0",
  "playwright-stealth>=1.0.6",
]

# Tier 1 stealth HTTP (curl_cffi) + Tier 3 stealth browsers
stealth = [
  "curl-cffi>=0.7.0",
  "nodriver>=0.33.0",
  "camoufox>=0.4.0",
  "patchright>=1.52.0",
]

# LLM providers
ollama = ["ollama>=0.3.0"]
openai = ["openai>=1.40.0"]
anthropic = ["anthropic>=0.34.0"]
llama-cpp = ["llama-cpp-python>=0.2.90"]

# DataFrame outputs (pyarrow is required by pandas for Parquet in silkweb.output.files)
pandas = ["pandas>=2.2.0", "pyarrow>=15.0.0"]
polars = ["polars>=1.0.0"]

# Rendered page cache backend (RenderedPageCache backend="redis")
redis = ["redis>=5.0.0"]

# HuggingFace Dataset output (silkweb.output.dataset.to_dataset)
datasets = ["datasets>=2.16.0"]

# DuckDB file export (silkweb.output.files.to_duckdb)
duckdb = ["duckdb>=1.0.0"]

# Prometheus metrics HTTP server (silkweb.observability.metrics)
prometheus = ["prometheus-client>=0.20.0"]

# CLI shell helper (typer command that imports IPython.embed)
ipython = ["ipython>=8.12.0"]

# Test/dev helpers (not installed by default)
test = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-httpx>=0.30.0",
  "mypy>=1.10.0",
  "ruff>=0.8.0",
]

# Documentation
docs = [
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.25.0",
  "mkdocs-autorefs>=1.0.0",
]

# Convenience umbrella
all = [
  "silkweb[browser,stealth,ollama,openai,anthropic,llama-cpp,pandas,polars,redis,datasets,duckdb,prometheus]",
]

[project.urls]
Homepage = "https://pypi.org/project/silkweb/"
Repository = "https://github.com/your-org/silkweb"

[project.scripts]
silkweb = "silkweb.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["silkweb"]
include = [
  "silkweb/recipes/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "examples",
  "notebooks",
]

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP", "SIM", "RUF",
]
ignore = [
  "E501", # line length (handled by formatter, and docs can exceed)
]

[tool.ruff.lint.per-file-ignores]
# Public API: sync helpers must be defined before importing submodules (heavy import graph).
"silkweb/__init__.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["silkweb"]
omit = [
  # Optional / integration-heavy modules (covered in dedicated jobs or local runs)
  "silkweb/cli/*",
  "silkweb/session/recorder.py",
  "silkweb/session/session.py",
  "silkweb/stealth/behavior.py",
  "silkweb/fetch/tiers/stealth_fetcher.py",
  "silkweb/fetch/tiers/playwright_fetcher.py",
  "silkweb/fetch/tiers/curl_cffi_fetcher.py",
  "silkweb/output/dataset.py",
  "silkweb/llm/constrained.py",
  "silkweb/silkql/compiler.py",
  "silkweb/discover.py",
]

[tool.coverage.report]
fail_under = 77
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
  "silkweb.cli.*",
  "silkweb.session.*",
  "silkweb.stealth.behavior",
  "silkweb.fetch.tiers.playwright_fetcher",
  "silkweb.fetch.tiers.stealth_fetcher",
  "silkweb.fetch.tiers.curl_cffi_fetcher",
  "silkweb.output.dataset",
]
ignore_errors = true
