name: hacker-news
description: Extract front-page stories from Hacker News.
url_pattern: "^https?://(www\\.)?news\\.ycombinator\\.com/"
silkql_query: |
  {
    stories[] {
      title
      url(url, optional)
      points(int, optional)
      comments_count(int, optional)
      author(optional)
    }
  }
fetch_tier: 0
wait_for: null
notes: |
  Targets the default HN listing page. Some fields may be missing depending on view/sort.

