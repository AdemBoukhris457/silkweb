<line x1="284" y1="22" x2="284" y2="198" stroke="#D1FAE5" stroke-width="1.5"/>

<!-- title -->
<text x="482" y="92"
  font-family="Verdana,Geneva,sans-serif"
  font-size="54" font-weight="700"
  fill="#064E3B" letter-spacing="2"
