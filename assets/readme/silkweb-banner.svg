<circle cx="170" cy="110" r="4"   fill="#059669" opacity="0.9"/>
<circle cx="192" cy="110" r="2.2" fill="#059669" opacity="0.8"/>
<circle cx="214" cy="110" r="2"   fill="#059669" opacity="0.7"/>
<circle cx="170" cy="88"  r="2"   fill="#059669" opacity="0.7"/>
