site_name: Silkweb
site_description: The LLM-native Python web scraping library
site_author: Silkweb contributors
# Canonical URL for the published docs site (GitHub Pages project site).
site_url: https://ademboukhris457.github.io/silkweb/

repo_url: https://github.com/AdemBoukhris457/silkweb
repo_name: AdemBoukhris457/silkweb

copyright: Copyright &copy; Silkweb contributors

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.prune
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  generator: false
  social:
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/silkweb/
      name: PyPI

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_bases: true
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Guides:
      - Fetcher Tiers: guides/fetcher-tiers.md
      - HTML Parsing & Selectors: guides/parsing.md
      - LLM Extraction: guides/llm-extraction.md
      - LLM Providers: guides/llm-providers.md
      - SilkQL Query Language: guides/silkql.md
      - Output Formats: guides/output-formats.md
      - Caching: guides/caching.md
      - Anti-Bot & Stealth: guides/anti-bot.md
      - Sessions & Auth: guides/sessions.md
      - Crawling & Concurrency: guides/crawling.md
      - Hidden API Discovery: guides/api-discovery.md
      - Watch & Change Detection: guides/watch.md
      - Observability: guides/observability.md
      - Recipes: guides/recipes.md
  - API Reference:
      - Public API: reference/api.md
      - Configuration: reference/config.md
      - Exceptions: reference/exceptions.md
      - SilkPage: reference/page.md
      - LLM Providers: reference/providers.md
      - Cache: reference/cache.md
      - CLI: reference/cli.md
  - FAQ: faq.md
